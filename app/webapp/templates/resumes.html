{% extends "base.html" %}

{% block content %}
<main>
    <h1>Resumes</h1>
    <p><a href="/resumes/new" class="btn-accent">+ New Resume</a></p>
    {% if resumes %}
        <ul>
            {% for resume in resumes %}
                <li><a href="/resumes/{{ resume['id'] }}">{{ resume['name'] }}</a></li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No resumes registered yet</p>
    {% endif %}
</main>
{% endblock %}
